AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  NCU AI Guidance backend on ECS Fargate behind an Application Load Balancer.
  Single task only (the app keeps PDF-chat stream locks in process memory).
  Chat models run on Azure OpenAI by default, or on Amazon Bedrock through the task role when
  AiProvider=bedrock (requires backend support for AI_PROVIDER). Embeddings always use Azure OpenAI.
  See docs/aws-deployment.md.

Parameters:
  ProjectName:
    Type: String
    Default: ncu-ai-guidance
    Description: Prefix for resource names.
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      At least two public subnets in different AZs (ALB needs two). Tasks also run here with a
      public IP so they can reach Azure OpenAI / Neon / Qdrant Cloud / Cloudinary / Firebase without a NAT gateway.
  CertificateArn:
    Type: String
    Description: >-
      ACM certificate ARN (same region) for the HTTPS listener. HTTPS is mandatory because the
      Firebase-hosted frontend is served over HTTPS (browsers block mixed content).
  SecretArn:
    Type: String
    Description: >-
      Full ARN of a Secrets Manager secret (JSON) holding AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY,
      DATABASE_URL, QDRANT_URL, QDRANT_API_KEY, CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY,
      CLOUDINARY_API_SECRET, FIREBASE_SERVICE_ACCOUNT_JSON, DEVELOPER_EMAILS.
  AllowedOrigins:
    Type: String
    Default: https://ncu-ai-guidance.web.app,https://ncu-ai-guidance.firebaseapp.com
    Description: Comma-separated CORS origins.
  FirebaseProjectId:
    Type: String
    Default: ncu-ai-guidance
  AiProvider:
    Type: String
    Default: azure
    AllowedValues: [azure, bedrock]
    Description: >-
      Chat model provider, passed to the container as AI_PROVIDER. "bedrock" needs a backend version
      that implements the AI_PROVIDER switch, and also grants the task role Bedrock invoke permissions.
      Embeddings stay on Azure OpenAI (text-embedding-3-large, 3072 dimensions) either way.
  LiveAiAccess:
    Type: String
    Default: all
    AllowedValues: [all, developers]
    Description: >-
      Who can use live chat-LLM features, passed to the container as LIVE_AI_ACCESS. "all" = everyone
      (default); "developers" = only signed-in accounts listed in the DEVELOPER_EMAILS secret with a
      verified email (others get HTTP 403). Use "developers" to keep production chat limited to the team.
  AzureOpenAiApiVersion:
    Type: String
    Default: 2024-12-01-preview
  AzureChatDeployment:
    Type: String
    Default: gpt-4o
    Description: Azure chat deployment name (AZURE_OPENAI_CHAT_DEPLOYMENT and AZURE_CHAT_DEPLOYMENT).
  AzureMiniDeployment:
    Type: String
    Default: gpt-4o-mini
    Description: Azure lightweight deployment name for PDF chat routing (AZURE_MINI_DEPLOYMENT).
  AzureEmbeddingDeployment:
    Type: String
    Default: text-embedding-3-large
    Description: >-
      Azure embedding deployment name (AZURE_OPENAI_EMBEDDING_DEPLOYMENT and AZURE_EMBEDDING_DEPLOYMENT).
      Must be text-embedding-3-large (3072 dimensions) to match the existing Qdrant collections.
  BedrockChatModelId:
    Type: String
    Default: ""
    Description: Only for AiProvider=bedrock. Main chat model ID or inference profile ID enabled in your Bedrock account.
  BedrockMiniModelId:
    Type: String
    Default: ""
    Description: Only for AiProvider=bedrock. Lightweight model for routing / short tasks; empty = same as the main model.
  PdfQdrantCollection:
    Type: String
    Default: reports
    Description: Qdrant collection for PDF chat.
  ImageTag:
    Type: String
    Default: latest
  DesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
    Description: >-
      Keep 0 on the first deployment (ECR is empty), push the image, then update the stack with 1.
      Never above 1: stream lock / cancel / steering are process-local.
  TaskCpu:
    Type: String
    Default: "2048"
    AllowedValues: ["1024", "2048", "4096"]
  TaskMemory:
    Type: String
    Default: "8192"
    Description: MiB; must be a valid Fargate combination for the chosen CPU. Tune down after watching CloudWatch.
  AlbIdleTimeoutSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 4000
    Description: Research agent nodes may run up to 10 minutes; SSE heartbeats arrive every 15 s.
  LogRetentionDays:
    Type: Number
    Default: 30

Rules:
  BedrockModelRequired:
    RuleCondition: !Equals [!Ref AiProvider, bedrock]
    Assertions:
      - Assert: !Not [!Equals [!Ref BedrockChatModelId, ""]]
        AssertDescription: BedrockChatModelId is required when AiProvider is bedrock.

Conditions:
  UseBedrock: !Equals [!Ref AiProvider, bedrock]
  HasBedrockMiniModel: !Not [!Equals [!Ref BedrockMiniModelId, ""]]
  UseBedrockMiniModel: !And [!Condition UseBedrock, !Condition HasBedrockMiniModel]

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-backend"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep last 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-backend"
      RetentionInDays: !Ref LogRetentionDays

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}"

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SecretArn

  # The application itself needs no AWS permissions with Azure OpenAI; Bedrock access is added
  # only when AiProvider=bedrock.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies: !If
        - UseBedrock
        - - PolicyName: invoke-bedrock
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - bedrock:InvokeModel
                    - bedrock:InvokeModelWithResponseStream
                  Resource:
                    # Cross-region inference profiles route to foundation models in other regions,
                    # so the foundation-model resource must allow any region.
                    - "arn:aws:bedrock:*::foundation-model/*"
                    - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
        - !Ref AWS::NoValue

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - public HTTP/HTTPS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fargate task - only reachable from the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSecurityGroup }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: !Ref AlbIdleTimeoutSeconds }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref TargetGroup }

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-backend"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ContainerDefinitions:
        - Name: backend
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Repository}:${ImageTag}"
          Essential: true
          PortMappings:
            - { ContainerPort: 8000, Protocol: tcp }
          # SSE streams need a clean shutdown window when a task is replaced
          StopTimeout: 120   # Fargate 允許的最大值
          Environment:
            - { Name: WEB_CONCURRENCY, Value: "1" }
            - { Name: ALLOWED_ORIGINS, Value: !Ref AllowedOrigins }
            - { Name: FIREBASE_PROJECT_ID, Value: !Ref FirebaseProjectId }
            - { Name: AI_PROVIDER, Value: !Ref AiProvider }
            - { Name: LIVE_AI_ACCESS, Value: !Ref LiveAiAccess }
            # Azure OpenAI：課程助理讀 AZURE_OPENAI_*，PDF 問答（backend/app/pdf_config.py）讀 AZURE_*_DEPLOYMENT
            - { Name: AZURE_OPENAI_API_VERSION, Value: !Ref AzureOpenAiApiVersion }
            - { Name: AZURE_OPENAI_CHAT_DEPLOYMENT, Value: !Ref AzureChatDeployment }
            - { Name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT, Value: !Ref AzureEmbeddingDeployment }
            - { Name: AZURE_CHAT_DEPLOYMENT, Value: !Ref AzureChatDeployment }
            - { Name: AZURE_MINI_DEPLOYMENT, Value: !Ref AzureMiniDeployment }
            - { Name: AZURE_EMBEDDING_DEPLOYMENT, Value: !Ref AzureEmbeddingDeployment }
            # Amazon Bedrock：只有 AiProvider=bedrock 才帶入
            - !If
              - UseBedrock
              - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
              - !Ref AWS::NoValue
            - !If
              - UseBedrock
              - { Name: BEDROCK_CHAT_MODEL_ID, Value: !Ref BedrockChatModelId }
              - !Ref AWS::NoValue
            - !If
              - UseBedrockMiniModel
              - { Name: BEDROCK_MINI_MODEL_ID, Value: !Ref BedrockMiniModelId }
              - !Ref AWS::NoValue
            - { Name: PDF_QDRANT_COLLECTION, Value: !Ref PdfQdrantCollection }
            - { Name: CLOUDINARY_PROJECT_FOLDER, Value: ncu-ai-guidance/data/raw/projects }
          Secrets:
            - { Name: AZURE_OPENAI_ENDPOINT, ValueFrom: !Sub "${SecretArn}:AZURE_OPENAI_ENDPOINT::" }
            - { Name: AZURE_OPENAI_API_KEY, ValueFrom: !Sub "${SecretArn}:AZURE_OPENAI_API_KEY::" }
            - { Name: DATABASE_URL, ValueFrom: !Sub "${SecretArn}:DATABASE_URL::" }
            - { Name: QDRANT_URL, ValueFrom: !Sub "${SecretArn}:QDRANT_URL::" }
            - { Name: QDRANT_API_KEY, ValueFrom: !Sub "${SecretArn}:QDRANT_API_KEY::" }
            - { Name: CLOUDINARY_CLOUD_NAME, ValueFrom: !Sub "${SecretArn}:CLOUDINARY_CLOUD_NAME::" }
            - { Name: CLOUDINARY_API_KEY, ValueFrom: !Sub "${SecretArn}:CLOUDINARY_API_KEY::" }
            - { Name: CLOUDINARY_API_SECRET, ValueFrom: !Sub "${SecretArn}:CLOUDINARY_API_SECRET::" }
            - { Name: FIREBASE_SERVICE_ACCOUNT_JSON, ValueFrom: !Sub "${SecretArn}:FIREBASE_SERVICE_ACCOUNT_JSON::" }
            - { Name: DEVELOPER_EMAILS, ValueFrom: !Sub "${SecretArn}:DEVELOPER_EMAILS::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: backend

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener, HttpRedirectListener]
    Properties:
      ServiceName: !Sub "${ProjectName}-backend"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      # Never run two tasks side by side for long; a rolling deploy overlaps them only briefly.
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - { ContainerName: backend, ContainerPort: 8000, TargetGroupArn: !Ref TargetGroup }

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  LoadBalancerDnsName:
    Description: Create a DNS record (CNAME / alias) from your API domain to this name.
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  ExecutionRoleArn:
    Description: Pass to github-oidc-deploy-role.yaml so iam:PassRole can be scoped to these two roles.
    Value: !GetAtt ExecutionRole.Arn
